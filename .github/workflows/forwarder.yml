name: Forwarder CI

on:
  pull_request:
    paths:
      - 'forwarder/**'
      - '.github/workflows/forwarder.yml'
  push:
    branches: [main]
    paths:
      - 'forwarder/**'
      - '.github/workflows/forwarder.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forwarder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Smoke tests
        # Linux runner required: the rotation/truncation tests rely on real
        # inode semantics.
        run: python tests/smoke_test.py
