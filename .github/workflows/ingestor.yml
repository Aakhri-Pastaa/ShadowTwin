name: Ingestor CI

on:
  pull_request:
    paths:
      - 'ingestor/**'
      - '.github/workflows/ingestor.yml'
  push:
    branches: [main]
    paths:
      - 'ingestor/**'
      - '.github/workflows/ingestor.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the tests, which drop and recreate their tables.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shadowtwin
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shadowtwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtwin -d shadowtwin_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests (normalisation, store, pipeline against real PostgreSQL)
        env:
          INGESTOR_TEST_DSN: postgresql://shadowtwin:ci-only@localhost:5432/shadowtwin_test
        run: |
          python tests/smoke_test.py | tee test.out
          # Fail if the database tests were skipped: in CI they must run.
          ! grep -q '^SKIP' test.out
