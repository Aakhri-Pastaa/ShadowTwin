name: Host agent CI

on:
  pull_request:
    paths:
      - 'host-agent/**'
  push:
    branches: [main]
    paths:
      - 'host-agent/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
