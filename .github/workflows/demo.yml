name: Demo CI

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'forwarder/**'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'forwarder/**'
      - '.github/workflows/demo.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r forwarder/requirements.txt ruff
      - name: Lint
        run: ruff check demo
      - name: Integration test (generator -> forwarder -> gap audit)
        # Runs the real forwarder against the real generator through a
        # rotation and a truncation, with a fake producer. No Docker needed.
        working-directory: demo
        run: python tests/demo_test.py
      - name: Validate compose file
        run: docker compose -f demo/docker-compose.yml config --quiet
