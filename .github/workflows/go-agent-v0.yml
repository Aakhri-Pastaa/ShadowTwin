name: go-agent-v0 CI (archived)

on:
  pull_request:
    paths:
      - 'go-agent-v0/**'
  push:
    branches: [main]
    paths:
      - 'go-agent-v0/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-agent-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
