# Run `pip install pre-commit && pre-commit install` once per machine.
# Run `pre-commit autoupdate` every so often to bump the pinned revisions.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  # go vet needs module context, but the module lives in go-agent-v0/, not the
  # repo root. Run it there via a local hook so it mirrors CI exactly
  # (go-agent-v0.yml runs `go vet ./...` with working-directory: go-agent-v0).
  # go-agent-v0 is archived (superseded by Wazuh) but still kept green.
  - repo: local
    hooks:
      - id: go-vet
        name: go vet (go-agent-v0 module, archived)
        entry: bash -c 'cd go-agent-v0 && go vet ./...'
        language: system
        files: ^go-agent-v0/.*\.go$
        pass_filenames: false
