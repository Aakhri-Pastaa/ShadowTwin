<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lt ld" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="lt">ShadowTwin closed loop</title>
  <desc id="ld">A six-stage cycle: Wazuh detects, Evaluator triages, Attacker proves the exploit, Defender advises a fix, a Human applies it, then the Attacker re-verifies. A packet travels the loop; it keeps looping until the attack fails.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#16112a"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5891"/>
    </marker>
    <filter id="lsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <rect x="0" y="0" width="720" height="350" rx="16" fill="url(#lbg)"/>

  <!-- connector ring (hexagon through the 6 card centres) -->
  <path d="M360,48 L470,111 L470,239 L360,302 L250,239 L250,111 Z" fill="none"
        stroke="#2c3765" stroke-width="2.5" stroke-linejoin="round"
        marker-mid="url(#arw)"/>
  <path d="M360,48 L470,111 L470,239 L360,302 L250,239 L250,111 Z" fill="none"
        stroke="#8b5cf6" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="6 12" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="180" to="0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- centre -->
  <text x="360" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#7d88ba">run the loop</text>
  <text x="360" y="190" text-anchor="middle" font-size="11.5" fill="#5c6699">until the attack fails</text>

  <!-- stage cards: cx,cy then two lines -->
  <g font-weight="700" text-anchor="middle">
    <!-- detect -->
    <g transform="translate(306,25)"><rect width="108" height="46" rx="10" fill="#141a30" stroke="#38bdf8"/><text x="54" y="21" font-size="12" fill="#e6edf7">🛰 Wazuh</text><text x="54" y="37" font-size="10" font-weight="600" fill="#7fd3f5">detect</text></g>
    <!-- triage -->
    <g transform="translate(416,88)"><rect width="108" height="46" rx="10" fill="#141a30" stroke="#818cf8"/><text x="54" y="21" font-size="12" fill="#e6edf7">🧠 Evaluator</text><text x="54" y="37" font-size="10" font-weight="600" fill="#a5b0ff">triage</text></g>
    <!-- prove -->
    <g transform="translate(416,216)"><rect width="108" height="46" rx="10" fill="#141a30" stroke="#f472b6"/><text x="54" y="21" font-size="12" fill="#e6edf7">💥 Attacker</text><text x="54" y="37" font-size="10" font-weight="600" fill="#f8a8d0">prove exploit</text></g>
    <!-- advise -->
    <g transform="translate(306,279)"><rect width="108" height="46" rx="10" fill="#141a30" stroke="#a78bfa"/><text x="54" y="21" font-size="12" fill="#e6edf7">🛡 Defender</text><text x="54" y="37" font-size="10" font-weight="600" fill="#c4b5fd">advise fix</text></g>
    <!-- fix -->
    <g transform="translate(196,216)"><rect width="108" height="46" rx="10" fill="#1a2440" stroke="#34d399"/><text x="54" y="21" font-size="12" fill="#e6edf7">🧑 Human</text><text x="54" y="37" font-size="10" font-weight="600" fill="#6ee7b7">apply fix</text></g>
    <!-- re-verify -->
    <g transform="translate(196,88)"><rect width="108" height="46" rx="10" fill="#141a30" stroke="#22d3ee"/><text x="54" y="21" font-size="12" fill="#e6edf7">🔁 Attacker</text><text x="54" y="37" font-size="10" font-weight="600" fill="#7fe9f5">re-verify</text></g>
  </g>

  <!-- travelling packet -->
  <circle r="9" fill="#22d3ee" opacity="0.5" filter="url(#lsoft)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M360,48 L470,111 L470,239 L360,302 L250,239 L250,111 Z"/>
  </circle>
  <circle r="4.5" fill="#eafcff">
    <animateMotion dur="6s" repeatCount="indefinite" path="M360,48 L470,111 L470,239 L360,302 L250,239 L250,111 Z"/>
  </circle>
</svg>
