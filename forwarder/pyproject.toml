[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowtwin-forwarder"
description = "Real-time forwarder that tails Wazuh NDJSON log files into Apache Kafka"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kunal Patil", email = "kunalrpatil324@gmail.com" }]
dynamic = ["version"]
dependencies = [
    "confluent-kafka>=2.5,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
shadowtwin-forwarder = "app:main"

[tool.setuptools]
py-modules = ["app", "checks", "config", "logger", "producer", "state", "version", "watcher"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"
